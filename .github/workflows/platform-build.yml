name: Build ZENVIA Platform

on:
  pull_request:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/platform-build.yml'
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/platform-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: zenvia-platform-dist
          path: platform/dist
          if-no-files-found: error
          retention-days: 7
