<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      (function(){
        try{
          var preference=localStorage.getItem('zenvia-gestion-theme-preference');
          var resolved=localStorage.getItem('zenvia-gestion-theme')||localStorage.getItem('zenvia-gastos-theme');
          var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme=preference==='light'||preference==='dark'
            ?preference
            :preference==='system'
              ?(dark?'dark':'light')
              :(resolved==='light'||resolved==='dark'?resolved:(dark?'dark':'light'));
          document.documentElement.dataset.theme=theme;
          document.documentElement.style.colorScheme=theme;
        }catch(_error){}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/zenvia-app-icon.webp" />
    <link rel="apple-touch-icon" type="image/svg+xml" href="/zenvia-app-icon.svg" />
    <title>ZENVIA Gestión</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
